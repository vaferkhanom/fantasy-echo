<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>echtasy — فانتزی لیگ برتر</title>
<link rel="stylesheet" href="/fonts/fonts.css?v=3">
<link rel="stylesheet" href="/css/app.css?v=3">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">echtasy</span><span class="brand-fa">فانتزی لیگ برتر</span></div>
    <div id="topbar-right">
      <div id="gw-badge" class="pill hidden"></div>
      <button id="btn-admin" class="icon-btn hidden" title="پنل مدیریت">⚙️</button>
    </div>
  </header>
  <div class="ticker hidden" id="ticker"><div class="ticker-track" id="ticker-track"></div></div>
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="home" class="tab active"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20h-5.5v-5h-5v5H4z"/></svg><span>خانه</span></button>
    <button data-tab="squad" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.6"/><circle cx="5.5" cy="12" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="18.5" cy="12" r="2.6"/><circle cx="9" cy="18.5" r="2.6"/><circle cx="15" cy="18.5" r="2.6"/></svg><span>تیم</span></button>
    <button data-tab="market" class="tab"><svg viewBox="0 0 24 24"><path d="M6 7h12l1.5 12.5a1 1 0 0 1-1 1.1H5.5a1 1 0 0 1-1-1.1L6 7zm3-3.5h6l1 2H8l1-2z"/></svg><span>بازار</span></button>
    <button data-tab="leagues" class="tab"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm0 3.2a2.4 2.4 0 1 1-2.4 2.4A2.4 2.4 0 0 1 12 6.2zM6.4 15.4a5.7 5.7 0 0 1 11.2 0z"/></svg><span>لیگ‌ها</span></button>
    <button data-tab="profile" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 19.5a7 7 0 0 1 14 0z"/></svg><span>پروفایل</span></button>
  </nav>
</div>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<script type="module" src="/js/app.js?v=3"></script>
</body>
</html>
